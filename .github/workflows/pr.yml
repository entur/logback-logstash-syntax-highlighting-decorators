name: PR
on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, edited]
# This repo's default GITHUB_TOKEN is restricted (contents:read only), so grant
# pull-requests:read explicitly — the reused gha-meta verify-pr.yml needs it and
# would otherwise be clamped to none, failing the run at startup.
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-pr:
    name: PR
    if: ${{ github.event_name == 'pull_request' }}
    uses: entur/gha-meta/.github/workflows/verify-pr.yml@v1

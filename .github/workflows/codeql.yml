# Reusable Workflows see: https://github.com/entur/gha-security/blob/main/README-code-scan.md

name: CodeQL Scan

on:
  pull_request:
    branches:
      - "master"
    paths-ignore:
      - '**/README.md'
  push:
    branches:
      - "master"
    paths-ignore:
      - '**/README.md'

permissions:
  actions: read
  contents: write
  pull-requests: write
  security-events: write
  issues: write

jobs:
  code-scan:
    name: CodeQL Scan
    uses: entur/gha-security/.github/workflows/code-scan.yml@v2
    secrets: inherit
    with:
      use_setup_java: true
      use_maven_cache: true
      java_version: "25"

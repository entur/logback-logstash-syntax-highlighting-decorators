# Reusable Workflows see: https://github.com/entur/gha-security/blob/main/README-code-scan.md

name: CodeQL Scan

on:
  pull_request:
    branches:
      - "master"
    paths-ignore:
      - '**/README.md'
  push:
    branches:
      - "master"
    paths-ignore:
      - '**/README.md'
  schedule:
    - cron: "0 3 * * MON" # Run Monday at 3AM UTC

jobs:
  code-scan:
    name: CodeQL Scan
    uses: entur/gha-security/.github/workflows/code-scan.yml@v2.12.1
    # no secrets necessary
    permissions: # some of these only apply when running on the default branch
      actions: read
      contents: write
      pull-requests: write
      security-events: write
      issues: write